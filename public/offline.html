<!doctype html>
<!--
    Shown by public/sw.js when a page can't be opened because there is no
    connection. One file with nothing else to load: it's the only thing the
    service worker keeps in its cache (the build's files change name at every deploy).
-->
<html lang="it">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#000000" />
        <meta name="robots" content="noindex" />
        <title>Sei offline · MioPersonal</title>
        <style>
            :root {
                color-scheme: dark;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: #000000;
                color: #fafafa;
                font-family:
                    system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
                text-align: center;
            }

            main {
                max-width: 340px;
            }

            .brand {
                margin: 0 0 40px;
                font-size: 15px;
                font-weight: 600;
                letter-spacing: 0.02em;
                color: #a3a3a3;
            }

            h1 {
                margin: 0 0 12px;
                font-size: 28px;
                font-weight: 700;
                line-height: 1.2;
            }

            p {
                margin: 0 0 32px;
                font-size: 16px;
                line-height: 1.5;
                color: #a3a3a3;
            }

            a {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                height: 48px;
                padding: 0 32px;
                border-radius: 999px;
                background: #fafafa;
                color: #0a0a0a;
                font-size: 16px;
                font-weight: 600;
                text-decoration: none;
            }

            a:focus-visible {
                outline: 3px solid #a3a3a3;
                outline-offset: 3px;
            }
        </style>
    </head>
    <body>
        <main>
            <p class="brand">MioPersonal</p>
            <h1>Sei offline</h1>
            <p>
                Controlla la connessione: la pagina si riapre da sola appena
                torna la rete.
            </p>
            <!-- An empty href opens again the address that was asked for. -->
            <a href="">Riprova</a>
        </main>
        <script>
            window.addEventListener('online', () => window.location.reload());
        </script>
    </body>
</html>
