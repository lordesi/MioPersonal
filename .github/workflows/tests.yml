name: tests

# Every push on every branch; a green run on main starts the deploy (deploy.yml).
on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          # gd and exif: uploaded photos are cleaned with them (app/Support/SafeImage.php).
          extensions: gd, exif
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      # The server builds with build:ssr: a broken SSR bundle must stop main before the deploy.
      - name: Build SSR bundle
        run: npx vp build --ssr

      # Known vulnerabilities in the libraries (dev-only npm tools excluded).
      - name: Audit dependencies
        run: |
          composer audit --abandoned=report
          npm audit --omit=dev --audit-level=high
