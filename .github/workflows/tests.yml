name: tests

# Every push on every branch; a green run on main starts the deploy (deploy.yml).
on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          # gd and exif: uploaded photos are cleaned with them (app/Support/SafeImage.php).
          extensions: gd, exif
          tools: composer:v2
          coverage: none

      # The Composer downloads are kept between runs: a new composer.lock starts a new cache.
      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # The npm downloads are kept between runs (key: package-lock.json).
          cache: npm

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      # The server builds with build:ssr: a broken SSR bundle must stop main before the deploy.
      - name: Build SSR bundle
        run: npx vp build --ssr

      # Known vulnerabilities in the libraries (dev-only npm tools excluded).
      - name: Audit dependencies
        run: |
          composer audit --abandoned=report
          node scripts/npm-audit.mjs

  # The same tests on PostgreSQL, the database of the site: the job above uses
  # SQLite, where the parts of the migrations only for PostgreSQL (the
  # constraints against double bookings…) and some raw queries never run.
  pgsql:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: gd, exif, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      # The pages need the built front end (the Vite manifest).
      - name: Setup Application
        run: composer setup

      # phpunit.xml chooses SQLite only when these are not set.
      - name: Run the tests on PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          php artisan config:clear --ansi
          php artisan test
